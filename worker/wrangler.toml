name = "agentic-roadmap-chat"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Workers AI binding - runs open-source models (Llama, Mistral, etc.)
# directly inside your Cloudflare account. No external API key needed.
[ai]
binding = "AI"

# Used for simple per-IP rate limiting. Create it with:
#   wrangler kv namespace create RATE_LIMIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
